[physics]
model_id = "nonminimal-scalar-tensor-recovery-v1"
shooting_tolerance = 1.0e-6
n_initial = -21.0
phi_initial = 0.0
n_final = 0.0
shooting_lower = 0.0
dphi_initial = 0.0
omega_gamma_h2 = 2.47739207701433e-5
shooting_upper = 5.0
neff = 3.044

[penalty]
fisher_pruning = false
mode = "functional_only"

[seeding]
reinjection_fraction = 0.02
reject_duplicate_guesses = true
reinject_interval = 25
require_function_sanity = true
neighbor_mutations_max = 3
reinject_after = 50
initial_fraction = 0.05
mutation_retry_limit = 20
neighbor_mutations_min = 1

    [[seeding.guesses]]
    label = "linear coupling and quadratic potential"
    U = "0.1 * Phi * Phi"
    F = "1.01 + 0.1 * Phi"
    [[seeding.guesses]]
    label = "Dimitrios and Achilleas"
    U = "0.1 * exp(-0.1 * Phi * Phi)"
    F = "1.0 + 0.1 * Phi * Phi * exp(-0.1 * Phi)"

[rng]
algorithm = "xoshiro"
seed = "104729"

[ga]
mutation_rate = 0.8
Npops = 1000
selection_rate = 0.5
Ngens = 2000
likelihoods = ["PantheonPlus_SH0ES_muG", "DESI_BAO", "Planck_Zhai", "Growth_RSD", "PPN_gamma_Cassini", "Gdot_LLR", "BBN_G"]
tour_size = 4
crossover_rate = 0.6
max_size = 15

[storage]
checkpoint_interval = 25
root = "/hydrarepo/galestas/George_version/runs/grid_main/task_56"
checkpoint_on_error = "warn"
top_k = -1
save_final_population = false
checkpoint_retain = 2

[minimizer]
time_limit = 2.0
fisher_fd_factor = 0.001
recovery_enabled = true
recovery_max_probes = 8
invalid_objective = 1.0e9
rejection_objective = 1.0e6
fisher_negative_tol = 0.0001
recovery_time_fraction = 0.2
max_prune_iterations = 8
g_tol = 0.001
