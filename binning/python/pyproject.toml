[project]
name = "wz-nautilus"
version = "0.1.0"
description = "Nautilus posteriors of binned and CPL w(z) with this project's data (DESI DR2 II Fig. 12 replica)"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "nautilus-sampler>=1.0.6",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
